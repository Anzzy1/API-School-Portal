<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ICCT Colleges Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">
                <div class="logo-icon"><i class="fas fa-graduation-cap"></i></div>
                <div class="logo-text">
                    <span class="logo-title">ICCT</span>
                    <span class="logo-subtitle">Colleges</span>
                </div>
            </a>
            <ul class="nav-links" style="display:flex;">
                <li><a href="/"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="#" onclick="logoutUser()" style="color:var(--danger)"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </div>
    </nav>

    <div style="padding-top:96px;max-width:800px;margin:0 auto;text-align:center;">
        <h1 style="font-size:32px;margin-bottom:16px;">Student Dashboard</h1>
        <p style="color:var(--gray);margin-bottom:32px;">Access your student information, grades, and reports.</p>
        <a href="/" class="btn-primary"><i class="fas fa-arrow-left"></i> Back to Portal</a>
    </div>
    <script src="script.js"></script>
</body>
</html>
